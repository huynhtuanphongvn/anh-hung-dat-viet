<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anh Hùng Đất Việt</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf5;--ink:#14202e;--card:#fff;--ov:rgba(236,242,250,.93);--sub:#4b5b70;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1320;--ink:#e8eef7;--card:#17233a;--ov:rgba(8,14,24,.92);--sub:#9fb0c8}}
:root[data-theme="dark"]{--bg:#0b1320;--ink:#e8eef7;--card:#17233a;--ov:rgba(8,14,24,.92);--sub:#9fb0c8}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;overflow:hidden}
#w{position:relative;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:var(--ov);overflow:auto;text-align:center}
.ov.on{display:flex}
h1{margin:0;font-size:clamp(28px,6vw,46px);line-height:1.05}
p{margin:0;color:var(--sub);max-width:46ch;line-height:1.35}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:660px}
button{font:inherit;color:var(--ink);cursor:pointer}
.c{background:var(--card);border:2px solid var(--k);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:transform .12s}
.c:hover,.c:focus-visible{transform:translateY(-3px);outline:3px solid var(--k);outline-offset:2px}
.c em{font-style:normal;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--k);color:#111;margin:2px 0}
.c b{font-size:20px}.c i{font-size:38px;font-style:normal}.c span{font-size:13px;color:var(--sub);line-height:1.25}
.u{width:min(360px,100%);text-align:left;align-items:flex-start;padding:12px 16px}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:10px 22px;font-size:18px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pt{--s:64px;width:var(--s);height:var(--s);border-radius:50%;border:3px solid var(--k);display:grid;place-items:center;font-size:calc(var(--s)*.5);box-shadow:0 0 14px var(--k)}.u{width:min(430px,100%)}.u strong{font-size:15px}button:disabled{opacity:.4;cursor:not-allowed}.c.off{opacity:.4}.ov{justify-content:safe center}
.pt{display:block;width:var(--s);height:auto;border-radius:12px;overflow:hidden;line-height:0;border:3px solid var(--k);box-shadow:0 0 14px var(--k);background:#e7d3a6;font-size:inherit}.pt svg{display:block;width:100%;height:auto}.pt.lg{animation:gl 2.2s infinite alternate}@keyframes gl{to{box-shadow:0 0 28px var(--k)}}
.c{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 82%,var(--k)))}
#menu{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;padding:24px 4vw;color:#f4efe0;background:linear-gradient(90deg,rgba(6,10,18,.55),rgba(6,10,18,.08) 45%,rgba(6,10,18,.35))}#menu p{color:#e6dec8;text-shadow:0 1px 4px #000}
#ttl{align-self:flex-start;max-width:46vw}#ttl h1{font-family:"Noto Serif",Georgia,serif;font-size:clamp(34px,7vw,68px);background:linear-gradient(#fff1c2,#e0a93a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}#ttl small{color:#f1e6c4;font-size:15px;text-shadow:0 1px 4px #000}
#side{width:250px;display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:rgba(10,14,24,.74);border:1px solid rgba(224,169,58,.5);backdrop-filter:blur(6px)}#bar{justify-content:space-between}#bar b{padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.45);color:#ffe9a8;font-size:16px}
#nav{display:flex;flex-direction:column;gap:10px}#nav .go{background:linear-gradient(180deg,#b3261e,#7d1812);color:#ffe9a8;border:1px solid #e0a93a;text-align:left;font-size:18px}.hint{font-size:12px}
@media(max-width:560px){#side{width:180px;padding:12px}#ttl{max-width:48vw}}
.dp{display:grid;grid-template-columns:200px 1fr;gap:18px;width:min(780px,100%);text-align:left}.dl{display:flex;flex-direction:column;align-items:center;gap:8px}.pill{background:var(--k);color:#111;font-weight:700;padding:3px 14px;border-radius:99px}.rl{color:var(--sub);font-size:14px;text-align:center}
.nm{font-family:"Noto Serif",Georgia,serif;font-size:34px;font-weight:700;line-height:1}.tt{color:var(--k);font-weight:700;margin:4px 0 10px}.bx{background:var(--card);border:1px solid rgba(127,127,127,.3);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.st{display:grid;grid-template-columns:104px 1fr 62px;gap:10px;align-items:center;padding:3px 0}.st span{font-weight:700}.st u{display:block;height:8px;border-radius:9px;background:rgba(127,127,127,.25);overflow:hidden}.st i{display:block;height:100%;border-radius:9px}.st strong{text-align:right;font-size:19px}
.sk{font-size:14px;line-height:1.4;padding:4px 0;color:var(--sub)}.sk b{display:block;color:var(--k);font-size:15px}.bio{font-family:"Noto Serif",Georgia,serif;font-size:15px;line-height:1.65;text-align:justify}.bio h3{margin:0 0 6px;font-family:inherit;color:var(--k)}
@media(max-width:640px){.dp{grid-template-columns:1fr}}
</style></head><body>
<div id="w"><canvas id="c"></canvas>
<div class="ov on" id="menu"><div id="ttl"><h1>Anh Hùng<br>Đất Việt</h1><small>Sống sót · Lập chiến công · Sưu tầm danh tướng</small></div><div id="side">

<div class="row" id="bar"></div><div class="row" id="nav"></div>
<p id="best"></p><p class="hint">WASD / mũi tên hoặc kéo ngón tay để di chuyển</p></div></div>
<div class="ov" id="scr"></div>
<div class="ov" id="lvl"><h1>Lên cấp!</h1><p>Chọn một nâng cấp.</p><div class="row" id="ups" style="flex-direction:column;align-items:center"></div></div>
<div class="ov" id="over"><h1>Hết máu!</h1><p id="stat"></p><div class="row"><button class="go" id="again">Chơi lại</button><button class="go" id="pick">Đổi nhân vật</button></div></div>
</div>
<script>
/*== MODULE 00_core | owner:A | Canvas, resize ==*/

let W,H;

addEventListener('resize',rs);rs();

/*== MODULE 10_data_heroes | owner:B | Du lieu tuong: CH, RO, WP, NEW, thang do hiem ==*/

{id:'khien',n:'Lê Lai',t:'Công thần Lam Sơn',sn:'Liều mình cứu chúa',sd:'Mỗi 18 giây, bất tử 1,5 giây, hồi 15% máu và hất lùi kẻ địch.',cd2:18,col:'#9fb2c8',hp:190,sp:135},

dao:{ro:'Đấu sĩ · Vật lý cận chiến',hp:130,sp:150,crit:.08},
chuy:{ro:'Đột kích · Vật lý',hp:105,sp:175,crit:.15,dm:1.05},
cung:{ro:'Xạ thủ · Vật lý tầm xa',hp:85,sp:150,dm:1.2},
khien:{ro:'Đỡ đòn · Tanker',hp:130,sp:135,arm:.12,th:5,dm:.9,ic:'🛡️',d:'Khiên: giáng khiên đẩy lùi mọi kẻ địch áp sát, phản đòn khi bị chạm.'},
no:{ro:'Xạ thủ · Bùng nổ',hp:80,sp:145,dm:1.25,crit:.1,ic:'🎯',d:'Nỏ liên châu: bắn loạt tên xuyên thấu cực mạnh.'},
tho:{ro:'Pháp sư · Sát thương phép',hp:80,sp:150,dm:1.15,ar:1.15},
sach:{ro:'Pháp sư · Kiểm soát',hp:95,sp:150,xg:1.25,mg:1.5}};
CH.forEach(c=>{c.ic=IC[c.id];c.d=DD[c.id];Object.assign(c,RO[c.id])});
const RT=[{n:'Bình thường',c:'#9aa5b1'},{n:'Nổi tiếng',c:'#4aa3ff'},{n:'Danh tiếng',c:'#b06cff'},{n:'Huyền thoại',c:'#ffb21e'}],RT0={kiem:3,chuy:3,dao:2,cung:2,tho:2,sach:1,no:1,khien:0};
const WP={kiem:{sn:'Quân lệnh',sd:'Mỗi 10 giây, +40% tốc độ đánh trong 4 giây.',cd2:10},dao:{sn:'Hồi khí',sd:'Mỗi 11 giây, hồi 15% máu và bắn vòng đao khí.',cd2:11},chuy:{sn:'Thần tốc',sd:'Mỗi 8 giây, 2 giây chạy nhanh, bất tử, gây sát thương khi chạm.',cd2:8},cung:{sn:'Sóng xung kích',sd:'Mỗi 9 giây, sóng xung kích đẩy lùi quân địch.',cd2:9},khien:{sn:'Liều mình',sd:'Mỗi 18 giây, bất tử 1,5 giây, hồi 15% máu và hất lùi.',cd2:18},no:{sn:'Loạt tên thần',sd:'Mỗi 12 giây, bắn vòng 16 mũi tên xuyên thấu.',cd2:12},tho:{sn:'Áng văn chấn động',sd:'Mỗi 10 giây, đẩy lùi và gây sát thương kẻ địch xung quanh.',cd2:10},sach:{sn:'Thiên văn',sd:'Mỗi 11 giây, 6 thiên thạch giáng xuống.',cd2:11}};
const NEW=[
{id:'yk',n:'Yết Kiêu',t:'Tướng thủy chiến nhà Trần',w:'dao',rt:0,ic:'🤿',col:'#4aa3a3',ro:'Đấu sĩ · Vật lý',hp:115,sp:155},
{id:'dt',n:'Dã Tượng',t:'Gia tướng nhà Trần',w:'cung',rt:0,ic:'🐘',col:'#b8956a',ro:'Xạ thủ · Vật lý',hp:95,sp:150,dm:1.1},
{id:'lvh',n:'Lê Văn Hưu',t:'Sử gia',w:'sach',rt:0,ic:'📖',col:'#8fa8d8',ro:'Pháp sư · Hỗ trợ',hp:85,sp:150,xg:1.15},
{id:'pnl',n:'Phạm Ngũ Lão',t:'Danh tướng nhà Trần',w:'chuy',rt:1,ic:'🔨',col:'#d4764a',ro:'Đột kích · Vật lý',hp:125,sp:165,crit:.1,dm:1.1},
{id:'cva',n:'Chu Văn An',t:'Nhà giáo · Thầy của muôn đời',w:'tho',rt:1,ic:'🎓',col:'#c9a2ff',ro:'Pháp sư · Sát thương phép',hp:85,sp:150,dm:1.2,ar:1.1},
{id:'tqt',n:'Trần Quốc Toản',t:'Thiếu niên anh hùng',w:'kiem',rt:1,ic:'🚩',col:'#ff7a7a',ro:'Chỉ huy · Cân bằng',hp:105,sp:170,crit:.12,dm:1.15},
{id:'nq',n:'Ngô Quyền',t:'Vua · Chiến thắng Bạch Đằng',w:'khien',rt:2,ic:'⚓',col:'#5aa0d8',ro:'Đỡ đòn · Tanker',hp:185,sp:140,arm:.2,th:7},
{id:'tt',n:'Trưng Trắc',t:'Nữ vương · Hai Bà Trưng',w:'kiem',rt:2,ic:'👑',col:'#ff9ac2',ro:'Chỉ huy · Vật lý',hp:125,sp:155,arm:.1,crit:.12,dm:1.2},
{id:'ll',n:'Lê Lợi',t:'Bình Định Vương · Vua Lê',w:'kiem',rt:3,ic:'🐢',col:'#48d19a',ro:'Chỉ huy · Toàn diện',hp:150,sp:160,arm:.15,crit:.12,dm:1.3,xg:1.15},
{id:'tg',n:'Thánh Gióng',t:'Phù Đổng Thiên Vương',w:'chuy',rt:3,ic:'🐎',col:'#ffb21e',ro:'Đột kích · Sức mạnh thần',hp:140,sp:175,arm:.12,crit:.15,dm:1.4},
{id:'ndc',n:'Nguyễn Đình Chiểu',t:'Nhà thơ yêu nước · Đồ Chiểu',w:'tho',rt:3,ic:'✒️',col:'#7fa8ff',ro:'Pháp sư · Thi sĩ yêu nước',hp:95,sp:150,dm:1.35,ar:1.2,crit:.1,xg:1.2},
{id:'td',n:'Trương Định',t:'Bình Tây Đại nguyên soái',w:'dao',rt:3,ic:'🏴',col:'#e0603a',ro:'Đấu sĩ · Du kích',hp:135,sp:165,arm:.1,crit:.12,dm:1.3}];

CH.forEach(c=>{c.w=c.w||c.id;const w=WP[c.w];c.rt=c.rt??RT0[c.id];c.sn=c.sn||w.sn;c.sd=c.sd||w.sd;c.cd2=c.cd2||w.cd2;c.d=c.d||DD[c.w]||RO[c.w].d});

/*== MODULE 12_data_bio_sketch | owner:B | SK (mu/rau/giap cho tranh) + BIO2 (tieu su) ==*/
const SK={ndc:[1,2,0],td:[5,1,1],kiem:[2,2,1],chuy:[3,1,1],dao:[4,0,1],cung:[2,1,1],tho:[0,2,0],sach:[0,1,0],khien:[2,1,1],no:[3,2,0],yk:[5,0,1],dt:[5,1,1],lvh:[1,2,0],pnl:[2,1,1],cva:[1,2,0],tqt:[5,0,1],nq:[2,2,1],tt:[4,0,1],ll:[3,2,1],tg:[5,0,1]};
const BIO2={ndc:'Nguyễn Đình Chiểu (1822–1888), thường gọi là Đồ Chiểu, sinh ở Gia Định, đỗ tú tài năm 1843. Ông bị mù hai mắt sau khi về chịu tang mẹ giữa lúc đi thi, nhưng vẫn mở trường dạy học và bốc thuốc cho dân. Ông để lại truyện thơ Lục Vân Tiên và Văn tế nghĩa sĩ Cần Giuộc (1861). Khi Pháp chiếm Nam Kỳ, ông về Ba Tri, Bến Tre, từ chối hợp tác với giặc và dùng ngòi bút làm vũ khí đến cuối đời.',td:'Trương Định (1820–1864) quê Quảng Ngãi, theo cha vào Nam, lập đồn điền ở Gò Công. Khi Pháp đánh Gia Định năm 1859, ông tổ chức nghĩa quân kháng chiến. Năm 1862, triều đình ký hòa ước và lệnh ông giải binh, nhưng ông ở lại cùng nhân dân, được suy tôn là Bình Tây Đại nguyên soái. Năm 1864, bị phục kích và bị thương nặng, ông rút gươm tự vẫn để không rơi vào tay giặc.',kiem:'Trần Quốc Tuấn (khoảng 1228–1300), được phong Hưng Đạo Đại Vương, giữ chức Quốc công tiết chế, tổng chỉ huy ba lần kháng chiến chống quân Mông – Nguyên (1258, 1285, 1288). Ông soạn Hịch tướng sĩ và Binh thư yếu lược. Năm 1288, ông bày trận cọc ngầm trên sông Bạch Đằng, tiêu diệt thủy quân giặc. Nhân dân tôn kính gọi ông là Đức Thánh Trần.',chuy:'Nguyễn Huệ (1753–1792) là người anh hùng áo vải của phong trào Tây Sơn. Năm 1785, ông đánh tan quân Xiêm ở Rạch Gầm – Xoài Mút. Năm 1789, ông lên ngôi hoàng đế, lấy hiệu Quang Trung, rồi hành quân thần tốc ra Bắc, đại phá quân Thanh trong chiến dịch Ngọc Hồi – Đống Đa chỉ trong những ngày đầu xuân.',dao:'Triệu Thị Trinh (225–248) người vùng núi Quan Yên, Thanh Hóa, còn gọi là Bà Triệu hay Triệu Ẩu. Khoảng năm 248, bà cùng anh là Triệu Quốc Đạt nổi dậy chống ách đô hộ nhà Ngô, lập căn cứ ở núi Nưa. Theo truyền thuyết, bà muốn cưỡi gió mạnh, đạp sóng dữ, chém cá kình ở biển Đông; cuộc khởi nghĩa kéo dài vài tháng thì thất bại.',cung:'Lý Thường Kiệt (1019–1105) là danh tướng nhà Lý, vốn là hoạn quan nhưng giỏi quân sự. Năm 1075, ông chủ động đem quân đánh sang Ung Châu, Khâm Châu, Liêm Châu để phá thế chuẩn bị của quân Tống. Năm 1076–1077, ông lập phòng tuyến sông Như Nguyệt, đẩy lùi quân Tống; bài thơ Nam quốc sơn hà gắn với trận này được xem là bản tuyên ngôn độc lập đầu tiên.',tho:'Nguyễn Trãi (1380–1442), hiệu Ức Trai, theo Lê Lợi từ buổi đầu khởi nghĩa Lam Sơn, là quân sư và người soạn thảo thư từ ngoại giao. Ông viết Bình Ngô đại cáo năm 1428, được coi là áng thiên cổ hùng văn, và để lại Quốc âm thi tập, Dư địa chí. Năm 1442 ông bị oan trong vụ án Lệ Chi Viên, sau được minh oan; năm 1980 UNESCO tôn vinh ông là Danh nhân văn hóa thế giới.',sach:'Lê Quý Đôn (1726–1784), người Thái Bình, đỗ Bảng nhãn năm 1752. Ông là nhà bác học đa tài thế kỷ XVIII, thông thạo sử học, địa lý, văn chương và triết học. Các tác phẩm tiêu biểu gồm Đại Việt thông sử, Phủ biên tạp lục, Vân đài loại ngữ và Kiến văn tiểu lục, ghi chép phong phú về đời sống, văn hóa và vật sản nước ta.',khien:'Lê Lai (?–1418), người Thanh Hóa, một trong những công thần đầu tiên của khởi nghĩa Lam Sơn. Năm 1418, khi Lê Lợi bị quân Minh vây ở núi Chí Linh, ông xin mặc áo bào và cầm cờ giả làm Lê Lợi để dẫn quân giặc đi nơi khác. Ông hy sinh, còn Lê Lợi thoát hiểm và tiếp tục cuộc khởi nghĩa. Công lao ấy được hậu thế ghi nhớ mãi.',no:'Theo truyền thuyết và sử cũ, Thục Phán An Dương Vương hợp nhất người Âu Việt và Lạc Việt, lập nên nước Âu Lạc vào thế kỷ III trước Công nguyên, đóng đô ở Cổ Loa với thành ốc xoắn nhiều vòng. Truyền thuyết kể rằng Rùa Vàng Kim Quy giúp ông xây thành và tặng móng làm nỏ thần Liên Châu bắn được nhiều mũi tên một lúc. Sau này Triệu Đà chiếm được Âu Lạc.',yk:'Yết Kiêu là gia tướng của Trần Hưng Đạo thời nhà Trần, quê vùng ven biển Hải Dương, nổi tiếng nhờ tài bơi lặn. Theo truyền thuyết, ông có thể lặn dưới nước hàng giờ để đục thủng thuyền giặc trong kháng chiến chống Mông – Nguyên. Ông còn được nhớ đến vì lòng trung thành tuyệt đối với chủ tướng, thà chiến đấu đến cùng chứ không chịu đầu hàng.',dt:'Dã Tượng là gia tướng thân cận của Trần Hưng Đạo, thường được nhắc cùng Yết Kiêu trong các câu chuyện dân gian về thời kháng chiến chống Mông – Nguyên. Tên ông gắn với sức khỏe phi thường và tinh thần xả thân. Theo truyền thuyết, khi Trần Hưng Đạo thử lòng các tướng, Dã Tượng và Yết Kiêu đều xin tử chiến chứ không xin hàng.',lvh:'Lê Văn Hưu (1230–1322) người Thanh Hóa, đỗ Bảng nhãn năm 1247 khi mới 17 tuổi, làm quan dưới triều Trần. Năm 1272, theo lệnh vua Trần Thánh Tông, ông biên soạn bộ Đại Việt sử ký gồm 30 quyển, bộ quốc sử đầu tiên của nước ta, chép từ Triệu Vũ Đế đến Lý Chiêu Hoàng. Tác phẩm nay đã thất lạc, một phần được các sử gia sau trích dẫn.',pnl:'Phạm Ngũ Lão (1255–1320) người Phù Ủng, nay thuộc Hưng Yên, xuất thân bình dân. Tương truyền Trần Hưng Đạo gặp ông khi đang ngồi đan sọt bên đường, mải nghĩ sách binh nên không tránh xe, rồi nhận ra tài năng và gả con gái cho. Ông lập nhiều chiến công chống quân Nguyên, giỏi cả võ lẫn thơ, bài Thuật hoài còn truyền lại.',cva:'Chu Văn An (1292–1370), người Thanh Trì, Hà Nội, là nhà giáo mẫu mực, làm Tư nghiệp Quốc Tử Giám đời Trần. Học trò của ông nhiều người thành đạt. Thấy triều chính suy đồi, ông dâng Thất trảm sớ xin chém bảy nịnh thần nhưng vua không nghe, nên từ quan về Chí Linh dạy học. Ông được thờ ở Văn Miếu và tôn là người thầy của muôn đời.',tqt:'Trần Quốc Toản (1267–1285), tước Hoài Văn Hầu, là thiếu niên hoàng tộc nhà Trần. Năm 1282, vì còn nhỏ tuổi nên không được dự Hội nghị Bình Than bàn kế đánh giặc, ông tức giận bóp nát quả cam trong tay lúc nào không hay. Sau đó ông tự chiêu mộ quân, may lá cờ đề sáu chữ Phá cường địch, báo hoàng ân, và anh dũng hy sinh năm 1285 khi còn rất trẻ.',nq:'Ngô Quyền (898–944), người Đường Lâm, Hà Nội, là con rể và tướng của Dương Đình Nghệ. Năm 938, ông cho đóng cọc nhọn bọc sắt dưới lòng sông Bạch Đằng, nhử thuyền Nam Hán vào lúc nước triều lên rồi đánh tan khi nước rút, giết thái tử Hoằng Tháo. Sau chiến thắng, ông xưng vương, đóng đô ở Cổ Loa, chấm dứt hơn nghìn năm Bắc thuộc.',tt:'Trưng Trắc (?–43) cùng em gái Trưng Nhị nổi dậy vào năm 40 tại Hát Môn, nhằm trả thù nhà và rửa nỗi nhục nước dưới ách đô hộ nhà Hán. Cuộc khởi nghĩa nhanh chóng chiếm được 65 thành, bà xưng vương và đóng đô ở Mê Linh. Năm 43 quân Hán do Mã Viện chỉ huy phản công; theo truyền thuyết, hai bà đã gieo mình xuống sông Hát để giữ trọn khí tiết.',ll:'Lê Lợi (1385–1433), hào trưởng đất Lam Sơn, Thanh Hóa, dựng cờ khởi nghĩa năm 1418 chống quân Minh. Sau gần mười năm gian khổ, với sự giúp sức của Nguyễn Trãi, nghĩa quân giành thắng lợi vang dội ở Tốt Động – Chúc Động, Chi Lăng – Xương Giang. Năm 1428 ông lên ngôi, lập nên nhà Hậu Lê. Truyền thuyết kể ông được trao gươm thần Thuận Thiên và sau trả lại ở hồ Hoàn Kiếm.',tg:'Thánh Gióng, hay Phù Đổng Thiên Vương, là vị anh hùng trong truyền thuyết thời Hùng Vương thứ sáu. Cậu bé ở làng Gióng lên ba vẫn chưa biết nói, cho đến khi nghe tin giặc Ân xâm lược liền cất tiếng xin sắt đúc roi và ngựa. Cậu vươn vai thành tráng sĩ, cưỡi ngựa sắt đánh tan giặc, khi roi gãy thì nhổ tre ven đường mà đánh. Dẹp giặc xong, ngài cởi giáp bay về trời trên núi Sóc.'};

/*== MODULE 30_art | owner:B | art() ve chan dung SVG, por() ==*/
function art(c){const s=SK[c.id]||[2,1,1],h=s[0],b=s[1],a=s[2],K='#2b1d12',S='#e8caa0',L=(d,f,w)=>'<path d="'+d+'" fill="'+(f||'none')+'" stroke="'+K+'" stroke-width="'+(w||2)+'" stroke-linecap="round" stroke-linejoin="round"/>';

g+=a?L('M30 114L60 130L90 114M24 130L60 146L96 130','none',1.5):L('M48 102L60 126L72 102','#f2e6c9');

if(b==1)g+=L('M43 74Q46 98 60 100Q74 98 77 74Q70 88 60 88Q50 88 43 74Z',K,1);
if(b==2)g+=L('M42 72Q44 114 60 122Q76 114 78 72Q70 90 60 90Q50 90 42 72Z',K,1);
const HT=[L('M44 54Q60 30 76 54V58H44Z',K)+L('M28 50H46M74 50H92','none',4),L('M42 58Q42 28 60 28Q78 28 78 58Q60 48 42 58Z',K),L('M40 58Q42 28 60 26Q78 28 80 58Z','#9a9a9a')+L('M60 26V12','none',2)+'<circle cx="60" cy="11" r="5" fill="#c0392b"/>',L('M40 50H80L76 32H44Z','#d9a72e')+L('M44 50V62M52 50V60M68 50V60M76 50V62','none',1.5),L('M40 64Q40 30 60 30Q80 30 80 64Q72 44 60 44Q48 44 40 64Z',K)+'<circle cx="60" cy="24" r="8" fill="'+K+'"/>'+L('M50 22L72 28','none',2),L('M40 62Q40 32 60 32Q80 32 80 62Q72 46 60 46Q48 46 40 62Z',K)+L('M40 52Q60 44 80 52V58Q60 50 40 58Z','#c0392b')+'<circle cx="60" cy="27" r="6" fill="'+K+'"/>'];
return g+HT[h]+'<rect x="90" y="122" width="17" height="17" fill="#b3261e"/><text x="98.5" y="135" font-size="12" text-anchor="middle" fill="#f6e7c8">'+'文儒將王女勇'[h]+'</text></svg>'}
const por=(c,s)=>'<div class="pt'+(c.rt==3?' lg':'')+'" style="--k:'+RT[c.rt].c+';--s:'+s+'px'+(c.n==='???'?';filter:brightness(0)':'')+'">'+art(c)+'</div>';

/*== MODULE 35_ui_screens | owner:A | Man hinh: menu, chon tuong, kho, ho so, nang cap, quay ve ==*/
function card(c,fn){const b=document.createElement('button');b.className='c';b.style.setProperty('--k',RT[c.rt].c);b.innerHTML=por(c,96)+'<b>'+c.n+'</b><em>'+RT[c.rt].n+'</em><small>'+c.ro+'</small>';b.onclick=fn;return b}
function grid(l,fn){const g=document.createElement('div');g.className='g';l.forEach(c=>g.appendChild(card(c,()=>fn(c))));return g}
function btn(t,f,cls){const b=document.createElement('button');b.className=cls||'go';b.textContent=t;b.onclick=f;return b}
function home(){$('bar').innerHTML='<b>🪙 '+SV.coin+'</b> <b>🎟 '+SV.tk+' vé</b>';const n=$('nav');n.innerHTML='';[['▶ Chơi',pickScr],['🎟 Quay vé',()=>gachaScr()],['🎒 Kho tướng',invScr],['⬆ Nâng cấp',upScr]].forEach(a=>n.appendChild(btn(a[0],a[1])))}
function scr(t,f,back){const o=$('scr');o.innerHTML='<h1>'+t+'</h1>';f(o);o.appendChild(btn('← Quay lại',back||(()=>{home();show('menu')})));show('scr')}
function pickScr(){scr('Chọn tướng',o=>o.appendChild(grid(owned(),start)))}
function invScr(){scr('Kho tướng ('+SV.own.length+'/'+CH.length+')',o=>{const l=[...CH].sort((a,b)=>b.rt-a.rt),g=document.createElement('div');g.className='g';l.forEach(c=>{const h=SV.own.includes(c.id),k=card(h?c:{...c,n:'???',ic:'❔',ro:'Chưa sở hữu'},()=>h&&detScr(c));if(!h)k.classList.add('off');g.appendChild(k)});o.appendChild(g)})}
function stats(c){const U=Object.assign({hp:0,arm:0,spd:0,dmg:0},SV.up[c.id]),P=v=>Math.round(v*100);return [['Máu',c.hp+10*U.hp,320,'#ff5468',''],['Giáp',P((c.arm||0)+.015*U.arm),60,'#7fb2ff','%'],['Tốc độ',c.sp+3*U.spd,220,'#4cd69a',''],['Sát thương',P((c.dm||1)*(1+.04*U.dmg)),200,'#ff9a3c','%'],['Chí mạng',P(c.crit||0),50,'#ffd23f','%'],['Phản đòn',c.th||0,30,'#c08aff',''],['Kinh nghiệm',P(c.xg||1),200,'#5fd0e8','%']]}
const row=s=>'<div class="st"><span>'+s[0]+'</span><u><i style="width:'+Math.min(100,s[1]/s[2]*100)+'%;background:'+s[3]+'"></i></u><strong style="color:'+s[3]+'">'+s[1]+s[4]+'</strong></div>';
function detScr(c){scr('Hồ sơ tướng',o=>{const d=document.createElement('div');d.className='dp';d.style.setProperty('--k',RT[c.rt].c);d.innerHTML='<div class="dl">'+por(c,190)+'<span class="pill">'+RT[c.rt].n+'</span><div class="rl">'+c.ro+'</div><div class="rl">⚔ Chiến lực '+Math.round(c.hp/2+c.sp/2+(c.dm||1)*100+(c.arm||0)*300+(c.crit||0)*300)+'</div></div><div><div class="nm">'+c.n+'</div><div class="tt">'+c.t+'</div><div class="bx">'+stats(c).map(row).join('')+'</div><div class="bx"><div class="sk"><b>⚔ Vũ khí</b>'+c.d+'</div><div class="sk"><b>✦ '+c.sn+'</b>'+c.sd+'</div></div><div class="bx bio"><h3>Tiểu sử</h3>'+BIO2[c.id]+'</div></div>';o.appendChild(d)},invScr)}
const UP=[['hp','Máu','+10',40,20,10],['arm','Giáp','+1,5%',60,30,8],['spd','Tốc độ','+3',40,25,8],['dmg','Sát thương','+4%',60,30,10]];
function upScr(){scr('Nâng cấp tướng',o=>{o.insertAdjacentHTML('beforeend','<p>🪙 '+SV.coin+' · Chọn tướng để nâng chỉ số gốc</p>');o.appendChild(grid(owned(),upDet))})}
function upDet(c){scr(c.n,o=>{const U=Object.assign({hp:0,arm:0,spd:0,dmg:0},SV.up[c.id]);o.insertAdjacentHTML('beforeend',por(c,80)+'<p>🪙 '+SV.coin+'</p>');UP.forEach(a=>{const k=a[0],lv=U[k],cost=a[3]+a[4]*lv,b=btn('',()=>{if(lv>=a[5]||SV.coin<cost)return;SV.coin-=cost;U[k]++;SV.up[c.id]=U;save();upDet(c)},'c u');b.style.setProperty('--k',RT[c.rt].c);b.innerHTML='<b>'+a[1]+' (cấp '+lv+'/'+a[5]+')</b><span>'+a[2]+' mỗi cấp · '+(lv>=a[5]?'Tối đa':'Giá '+cost+' 🪙')+'</span>';b.disabled=lv<a[5]&&SV.coin<cost;o.appendChild(b)})},upScr)}
function pull(){const r=Math.random();let rt=r<.03?3:r<.15?2:r<.45?1:0;if(SV.lg>=39)rt=3;else if(SV.pt>=9&&rt<2)rt=Math.random()<.2?3:2;SV.pt=rt>=2?0:SV.pt+1;SV.lg=rt===3?0:SV.lg+1;const p=CH.filter(c=>c.rt===rt),c=p[Math.floor(Math.random()*p.length)],dup=SV.own.includes(c.id);if(dup)SV.coin+=50+rt*100;else SV.own.push(c.id);return{c,dup,rt}}
function gachaScr(res){scr('Quay vé',o=>{o.insertAdjacentHTML('beforeend','<p>🎟 '+SV.tk+' vé · 🪙 '+SV.coin+'<br>Đảm bảo Danh tiếng trở lên sau 10 lượt, Huyền thoại sau 40 lượt. Tướng trùng đổi thành coin. Chơi game để nhận thêm vé.</p>');const r=document.createElement('div');r.className='row';[1,10].forEach(n=>{const b=btn('Quay '+n+' vé',()=>{SV.tk-=n;const a=[];for(let i=0;i<n;i++)a.push(pull());save();gachaScr(a)});b.disabled=SV.tk<n;r.appendChild(b)});o.appendChild(r);if(res){const l=document.createElement('div');l.className='g';res.forEach(x=>{const k=card(x.c,()=>{});if(x.dup)k.querySelector('small').textContent='Trùng · +'+(50+x.rt*100)+' coin';l.appendChild(k)});o.appendChild(l)}})}

/*== MODULE 40_upgrades | owner:A | UPG: nang cap khi len cap ==*/
